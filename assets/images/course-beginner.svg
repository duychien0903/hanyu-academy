<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bg01" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F4"/>
      <stop offset="100%" stop-color="#F2EBE1"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#bg01)"/>
  
  <!-- Subtle Background Hanzi -->
  <text x="310" y="190" font-family="'Noto Sans SC', serif" font-size="130" font-weight="900" fill="#9F2638" fill-opacity="0.06">基</text>

  <!-- Pinyin Tone wave -->
  <path d="M 40 80 Q 90 40 140 80 T 240 80 T 340 80" stroke="#C73E4D" stroke-width="2" stroke-dasharray="3 3" opacity="0.4"/>
  
  <!-- Visual Book / Flashcard card in 3D-like modern angle -->
  <g transform="translate(60, 40)">
    <rect x="0" y="0" width="150" height="150" rx="14" fill="#FFFFFF" stroke="#E8E3DD" stroke-width="1.5"/>
    <rect x="15" y="15" width="40" height="20" rx="4" fill="#FDF2F4"/>
    <text x="35" y="29" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif" font-size="10" font-weight="700" fill="#9F2638">CƠ BẢN</text>
    
    <!-- Pinyin Chart element -->
    <text x="75" y="85" text-anchor="middle" font-family="'Noto Sans SC', serif" font-size="52" font-weight="700" fill="#17243A">汉</text>
    <text x="75" y="112" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif" font-size="14" font-weight="600" fill="#C73E4D">Hàn • [hàn]</text>
    <text x="75" y="132" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif" font-size="11" fill="#6B7280">Thanh 4 (Xuống dứt khoát)</text>
  </g>

  <!-- Four Tones Visual Card -->
  <g transform="translate(230, 50)">
    <rect width="130" height="130" rx="12" fill="#17243A"/>
    <text x="65" y="30" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif" font-size="11" font-weight="700" fill="#FAF8F4">4 THANH ĐIỆU</text>
    <line x1="20" y1="40" x2="110" y2="40" stroke="#334155" stroke-width="1"/>
    
    <!-- Tone 1 -->
    <text x="35" y="65" font-family="'Noto Sans SC', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">mā</text>
    <line x1="68" y1="60" x2="105" y2="60" stroke="#C73E4D" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Tone 2 -->
    <text x="35" y="87" font-family="'Noto Sans SC', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">má</text>
    <line x1="70" y1="87" x2="105" y2="76" stroke="#C73E4D" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Tone 3 -->
    <text x="35" y="110" font-family="'Noto Sans SC', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">mǎ</text>
    <path d="M 70 102 L 87 111 L 105 99" fill="none" stroke="#C73E4D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
