<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bg03" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F4"/>
      <stop offset="100%" stop-color="#EFE6DA"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#bg03)"/>
  
  <text x="310" y="190" font-family="'Noto Sans SC', serif" font-size="130" font-weight="900" fill="#9F2638" fill-opacity="0.06">试</text>

  <!-- HSK Certificate Badge in Center -->
  <g transform="translate(60, 45)">
    <rect width="280" height="150" rx="14" fill="#FFFFFF" stroke="#E8E3DD" stroke-width="1.5"/>
    <rect x="15" y="15" width="250" height="120" rx="10" fill="none" stroke="#E8E3DD" stroke-dasharray="3 3"/>
    
    <!-- Seal Icon inside -->
    <rect x="35" y="35" width="46" height="46" rx="8" fill="#9F2638"/>
    <text x="58" y="65" text-anchor="middle" font-family="'Noto Sans SC', serif" font-size="24" font-weight="700" fill="#FFFFFF">考</text>
    
    <text x="95" y="52" font-family="'Be Vietnam Pro', sans-serif" font-size="16" font-weight="800" fill="#17243A">HSK STANDARD</text>
    <text x="95" y="70" font-family="'Be Vietnam Pro', sans-serif" font-size="12" font-weight="600" fill="#C73E4D">Luyện thi HSK 1 - HSK 4</text>
    <text x="95" y="90" font-family="'Be Vietnam Pro', sans-serif" font-size="11" fill="#6B7280">Hệ thống từ vựng &amp; Bộ đề chuẩn</text>

    <!-- Progress Score bar -->
    <rect x="35" y="105" width="210" height="8" rx="4" fill="#F1F5F9"/>
    <rect x="35" y="105" width="170" height="8" rx="4" fill="#9F2638"/>
    <text x="215" y="125" font-family="'Be Vietnam Pro', sans-serif" font-size="10.5" font-weight="700" fill="#9F2638">Mục tiêu đỗ cao</text>
  </g>
</svg>
