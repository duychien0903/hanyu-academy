<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 580" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F4"/>
      <stop offset="50%" stop-color="#F5EFE6"/>
      <stop offset="100%" stop-color="#EFE6DA"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FAF8F4"/>
    </linearGradient>
    <linearGradient id="wineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9F2638"/>
      <stop offset="100%" stop-color="#C73E4D"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#17243A" flood-opacity="0.08"/>
    </filter>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#17243A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect x="20" y="20" width="680" height="540" rx="24" fill="url(#heroBg)"/>
  
  <!-- Subtle Editorial Hanzi Watermark Background -->
  <text x="420" y="240" font-family="'Noto Sans SC', 'Be Vietnam Pro', serif" font-size="180" font-weight="900" fill="#9F2638" fill-opacity="0.03">学</text>
  <text x="50" y="480" font-family="'Noto Sans SC', 'Be Vietnam Pro', serif" font-size="140" font-weight="900" fill="#17243A" fill-opacity="0.025">未来</text>

  <!-- Decorative Minimalist Grid & Curves -->
  <circle cx="560" cy="110" r="80" stroke="#C73E4D" stroke-width="1" stroke-dasharray="4 6" opacity="0.3"/>
  <circle cx="560" cy="110" r="40" stroke="#9F2638" stroke-width="1" opacity="0.2"/>
  <path d="M 60 180 Q 200 120 360 200" stroke="#E8E3DD" stroke-width="2" fill="none"/>

  <!-- Main Editorial Artwork Window -->
  <g filter="url(#softShadow)">
    <rect x="70" y="60" width="580" height="420" rx="18" fill="url(#cardGrad)" stroke="#E8E3DD" stroke-width="1.5"/>
    
    <!-- Editorial Header Bar inside Window -->
    <rect x="70" y="60" width="580" height="46" rx="18" fill="#FFFFFF"/>
    <line x1="70" y1="106" x2="650" y2="106" stroke="#E8E3DD" stroke-width="1"/>
    
    <!-- Window controls -->
    <circle cx="102" cy="83" r="5" fill="#C73E4D" opacity="0.8"/>
    <circle cx="118" cy="83" r="5" fill="#E8E3DD"/>
    <circle cx="134" cy="83" r="5" fill="#E8E3DD"/>
    
    <!-- Title tag in bar -->
    <text x="360" y="88" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif" font-size="13" font-weight="600" fill="#6B7280" letter-spacing="1.5">
      HANYU ACADEMY • KHÔNG GIAN HỌC TRỰC TUYẾN
    </text>

    <!-- Inner Study Scene Container -->
    <rect x="94" y="126" width="532" height="330" rx="12" fill="#F8F6F1"/>
    
    <!-- Illustration of Study Setting -->
    <!-- Window back wall with natural light -->
    <path d="M 94 126 L 400 126 L 400 340 L 94 340 Z" fill="#F2ECE1" opacity="0.5"/>
    
    <!-- Warm studio lamp line -->
    <path d="M 160 126 L 160 200 M 130 200 L 190 200 L 175 180 L 145 180 Z" stroke="#17243A" stroke-width="2" fill="#17243A" opacity="0.8"/>
    <polygon points="145,200 175,200 230,320 90,320" fill="#FFF8E7" opacity="0.35"/>

    <!-- Desk / Workspace Surface -->
    <path d="M 94 340 L 626 340 L 626 456 L 94 456 Z" fill="#EAE3D5"/>
    <line x1="94" y1="340" x2="626" y2="340" stroke="#DDD4C4" stroke-width="2"/>

    <!-- Modern Laptop Device -->
    <g transform="translate(240, 215)">
      <!-- Laptop Screen Outer -->
      <rect x="0" y="0" width="240" height="150" rx="8" fill="#17243A"/>
      <!-- Screen Display -->
      <rect x="6" y="6" width="228" height="138" rx="4" fill="#0F172A"/>
      
      <!-- Video lesson inside screen -->
      <rect x="14" y="14" width="212" height="100" rx="3" fill="#1E293B"/>
      <!-- Online Teacher / Lesson UI -->
      <circle cx="50" cy="55" r="22" fill="#334155"/>
      <circle cx="50" cy="48" r="9" fill="#F5EFE6"/>
      <path d="M36 68 C36 60, 64 60, 64 68 Z" fill="#F5EFE6"/>
      
      <!-- Lesson Content Slide inside laptop screen -->
      <rect x="85" y="24" width="130" height="75" rx="3" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="95" y="44" font-family="'Noto Sans SC', sans-serif" font-size="14" font-weight="700" fill="#FAF8F4">你好 (Nǐ hǎo)</text>
      <text x="95" y="62" font-family="'Be Vietnam Pro', sans-serif" font-size="10" fill="#C73E4D" font-weight="600">Thanh 3 + Thanh 3 → 2 + 3</text>
      <rect x="95" y="74" width="85" height="14" rx="3" fill="#9F2638"/>
      <text x="137" y="84" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif" font-size="8" fill="#FAF8F4" font-weight="600">Luyện nghe phản xạ</text>

      <!-- Laptop bottom controller -->
      <rect x="14" y="120" width="212" height="18" rx="2" fill="#17243A"/>
      <circle cx="28" cy="129" r="4" fill="#22C55E"/>
      <text x="38" y="132" font-family="'Be Vietnam Pro', sans-serif" font-size="8" fill="#94A3B8">Lớp trực tuyến: 1 Giảng viên &amp; 4 Học viên</text>

      <!-- Laptop Base -->
      <path d="M -25 150 L 265 150 L 250 162 L -10 162 Z" fill="#CBD5E1"/>
      <rect x="95" y="150" width="50" height="4" rx="2" fill="#94A3B8"/>
    </g>

    <!-- Notebook with Chinese Calligraphy Practice -->
    <g transform="translate(125, 335)">
      <polygon points="0,0 85,-15 110,45 25,60" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <!-- Grid lines for Hanzi practice (Mizi ge) -->
      <rect x="25" y="6" width="24" height="24" fill="#FFF5F5" stroke="#FECACA" stroke-width="0.8"/>
      <line x1="25" y1="18" x2="49" y2="18" stroke="#FECACA" stroke-dasharray="1 1" stroke-width="0.5"/>
      <line x1="37" y1="6" x2="37" y2="30" stroke="#FECACA" stroke-dasharray="1 1" stroke-width="0.5"/>
      <text x="37" y="24" text-anchor="middle" font-family="'Noto Sans SC', serif" font-size="17" font-weight="700" fill="#9F2638">学</text>
      
      <rect x="54" y="1" width="24" height="24" fill="#FFF5F5" stroke="#FECACA" stroke-width="0.8"/>
      <text x="66" y="19" text-anchor="middle" font-family="'Noto Sans SC', serif" font-size="17" font-weight="700" fill="#9F2638">习</text>

      <!-- Pen -->
      <path d="M 80 -10 L 96 35 L 91 38 L 76 -7 Z" fill="#9F2638"/>
      <polygon points="96,35 91,38 97,42" fill="#F59E0B"/>
    </g>

    <!-- Ceramic Coffee Cup -->
    <g transform="translate(540, 340)">
      <ellipse cx="25" cy="45" rx="26" ry="7" fill="#CBD5E1"/>
      <path d="M 10 20 L 14 43 C 14 46, 36 46, 36 43 L 40 20 Z" fill="#FAF8F4" stroke="#E2E8F0" stroke-width="1"/>
      <path d="M 38 24 C 47 24, 47 36, 37 38" fill="none" stroke="#FAF8F4" stroke-width="3"/>
      <ellipse cx="25" cy="20" rx="15" ry="4" fill="#6B4F3B"/>
    </g>

    <!-- Learner Visual Silhouette Graphic (Minimalist, Editorial) -->
    <g transform="translate(480, 160)">
      <circle cx="50" cy="50" r="32" fill="#E8DED1"/>
      <path d="M 26 120 C 26 80, 74 80, 74 120 Z" fill="#17243A"/>
      <!-- Modern headphones -->
      <path d="M 26 50 C 26 30, 74 30, 74 50" fill="none" stroke="#9F2638" stroke-width="4" stroke-linecap="round"/>
      <rect x="22" y="44" width="8" height="16" rx="4" fill="#9F2638"/>
      <rect x="70" y="44" width="8" height="16" rx="4" fill="#9F2638"/>
    </g>
  </g>

  <!-- FLOATING EDITORIAL BADGES (CRO Trust Triggers) -->
  
  <!-- Floating Pill 1: Hanzi "学" (Study / Learn) -->
  <g filter="url(#badgeShadow)" transform="translate(45, 110)">
    <rect width="70" height="70" rx="16" fill="#9F2638"/>
    <text x="35" y="45" text-anchor="middle" font-family="'Noto Sans SC', serif" font-size="32" font-weight="700" fill="#FFFFFF">学</text>
    <text x="35" y="59" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif" font-size="9" font-weight="600" fill="#FCE7F3" letter-spacing="1">HỌC TẬP</text>
  </g>

  <!-- Floating Pill 2: "你好" (Xin chào) -->
  <g filter="url(#badgeShadow)" transform="translate(560, 80)">
    <rect width="115" height="44" rx="22" fill="#FFFFFF" stroke="#E8E3DD" stroke-width="1.5"/>
    <circle cx="24" cy="22" r="12" fill="#FDF2F4"/>
    <text x="24" y="27" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="13" font-weight="700" fill="#9F2638">你</text>
    <text x="68" y="26" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif" font-size="12" font-weight="700" fill="#17243A">Nǐ hǎo • 你好</text>
  </g>

  <!-- Floating Pill 3: "未来" (Tương lai) -->
  <g filter="url(#badgeShadow)" transform="translate(530, 430)">
    <rect width="145" height="52" rx="14" fill="#17243A" stroke="#334155" stroke-width="1"/>
    <text x="22" y="32" font-family="'Noto Sans SC', sans-serif" font-size="20" font-weight="700" fill="#FAF8F4">未来</text>
    <text x="75" y="25" font-family="'Be Vietnam Pro', sans-serif" font-size="11" font-weight="700" fill="#FAF8F4">Tương lai</text>
    <text x="75" y="39" font-family="'Be Vietnam Pro', sans-serif" font-size="9.5" fill="#94A3B8">Mở rộng cơ hội</text>
  </g>

  <!-- Floating CRO Trust Card Bottom Left -->
  <g filter="url(#badgeShadow)" transform="translate(45, 420)">
    <rect width="265" height="68" rx="14" fill="#FFFFFF" stroke="#E8E3DD" stroke-width="1.5"/>
    <rect x="14" y="14" width="40" height="40" rx="10" fill="url(#wineGrad)"/>
    <!-- Checkmark & Phonetics icon -->
    <path d="M 28 34 L 33 39 L 41 28" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="33" font-family="'Be Vietnam Pro', sans-serif" font-size="12.5" font-weight="700" fill="#17243A">Phát âm chuẩn ngay từ đầu</text>
    <text x="64" y="49" font-family="'Be Vietnam Pro', sans-serif" font-size="10.5" fill="#6B7280">Khắc phục triệt để lỗi người Việt</text>
  </g>

  <!-- Subtitle note for transparency as requested -->
  <text x="360" y="525" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif" font-size="11" fill="#8C93A0" font-style="italic">
    Minh họa không gian học tập trực tuyến HANYU ACADEMY • Có thể thay bằng ảnh tư liệu thực tế
  </text>
</svg>
