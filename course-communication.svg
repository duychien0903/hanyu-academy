<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bg02" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F4"/>
      <stop offset="100%" stop-color="#F3EAE0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#bg02)"/>
  
  <text x="320" y="190" font-family="'Noto Sans SC', serif" font-size="130" font-weight="900" fill="#9F2638" fill-opacity="0.06">话</text>

  <!-- Speech bubble 1 (Left) -->
  <g transform="translate(40, 45)">
    <rect width="190" height="65" rx="16" fill="#9F2638"/>
    <path d="M 35 65 L 45 80 L 55 65 Z" fill="#9F2638"/>
    <text x="20" y="30" font-family="'Noto Sans SC', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">今天你忙不忙？</text>
    <text x="20" y="50" font-family="'Be Vietnam Pro', sans-serif" font-size="11.5" fill="#FCE7F3">Hôm nay bạn có bận không?</text>
  </g>

  <!-- Speech bubble 2 (Right) -->
  <g transform="translate(170, 125)">
    <rect width="190" height="65" rx="16" fill="#FFFFFF" stroke="#E8E3DD" stroke-width="1.5"/>
    <path d="M 145 125 L 155 140 L 165 125 Z" fill="#FFFFFF"/>
    <text x="20" y="30" font-family="'Noto Sans SC', sans-serif" font-size="16" font-weight="700" fill="#17243A">我今天不太忙。</text>
    <text x="20" y="50" font-family="'Be Vietnam Pro', sans-serif" font-size="11.5" fill="#6B7280">Hôm nay tôi không bận lắm.</text>
  </g>

  <!-- Interactive badge -->
  <g transform="translate(40, 160)">
    <rect width="110" height="32" rx="8" fill="#17243A"/>
    <circle cx="16" cy="16" r="4" fill="#22C55E"/>
    <text x="28" y="20" font-family="'Be Vietnam Pro', sans-serif" font-size="10.5" font-weight="600" fill="#FAF8F4">Phản xạ tự nhiên</text>
  </g>
</svg>
